name: Dart

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/README.md'

  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/README.md'

  # The daily run catches breakages caused by new Flutter releases, not by our commits.
  schedule:
    - cron: '34 5 * * *'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🎯 Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 🛠 Install dependencies
        run: dart pub get --no-example

      - name: 👨‍🎨 Validate formatting
        run: dart format --set-exit-if-changed lib test

      - name: 🕵️‍♀️ Analyze project source
        run: dart analyze --fatal-infos --format machine lib test

      - name: 🤖 Install coverage
        run: dart pub global activate coverage

      - name: 🧪 Run tests
        run: dart pub global run coverage:test_with_coverage --fail-under 100

      - name: 🥇 Update coverage badge
        if: github.event_name == 'push'
        uses: coverallsapp/github-action@v2.3.6
        with:
          github-token: ${{ secrets.github_token }}

      - name: 📈 Check pana
        run: | 
          dart pub global activate pana
          PANA=$(pana . --no-warning); PANA_SCORE=$(echo $PANA | sed -n "s/.*Points: \([0-9]*\)\/\([0-9]*\)./\1\/\2/p")
          echo "score: $PANA_SCORE"
          IFS='/'; read -a SCORE_ARR <<< "$PANA_SCORE"; SCORE=SCORE_ARR[0]; TOTAL=SCORE_ARR[1]
          if (( $SCORE < $TOTAL )); then echo "minimum score not met!"; exit 1; fi

  # Runs the example app against current Flutter releases, the way users consume
  # the package: next to flutter_test and test, which pin many shared dependencies.
  example:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        channel: [ stable, beta ]

    name: example (${{ matrix.channel }})

    defaults:
      run:
        working-directory: example

    steps:
      - uses: actions/checkout@v4

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          cache: true

      - name: 🛠 Install dependencies
        run: flutter pub get

      - name: 🏗 Generate tests
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🕵️‍♀️ Analyze tests
        run: flutter analyze test

      - name: 🧪 Run tests
        run: flutter test
