name: bdd_widget_test
description: A BDD-style widget testing library. Generates Flutter widget tests from *.feature files.
version: 3.0.0
repository: https://github.com/olexale/bdd_widget_test
issue_tracker: https://github.com/olexale/bdd_widget_test/issues

environment:
  sdk: ^3.8.0

dependencies:
  build: ^4.0.0
  characters: ^1.2.0
  collection: ^1.15.0
  cucumber_gherkin: ^42.0.1
  cucumber_messages: ^34.2.1
  dart_style: ^3.0.0
  diacritic: ^0.1.3
  file: ^7.0.0
  meta: ^1.7.0
  package_config: ^3.0.0
  path: ^1.8.0
  yaml: ^3.1.0

dev_dependencies:
  analyzer: ">=14.3.0 <14.5.0"  # TODO: remove once build_test depends on build_runner >=2.16.2
  build_runner: ^2.16.1
  build_test: ^3.5.20
  test: ^1.32.0
  very_good_analysis: ^11.0.0
